approvedGitRepositories:
    - "https://npm-registry.sipwise.com/*"

# vue-template-compiler is vulnerable to XSS via prototype pollution, but Vue 2
# is EOL with no patched version. It is an unused transitive devDependency of
# @quasar/quasar-app-extension-testing-unit-jest (via alias-hq's codemod CLI,
# which this project never invokes), and is never shipped in the production
# bundle. Excluded from yarn audit; the Dependabot alert is dismissed with the
# same justification. See ngcp-csc-ui https://gerrit.mgm.sipwise.com/c/ngcp-csc-ui/+/101727
# for the equivalent fix.
npmAuditExcludePackages:
    - vue-template-compiler

enableScripts: true

npmMinimalAgeGate: 0

enableTelemetry: false

nodeLinker: node-modules

packageExtensions:
    "@quasar/app-webpack@*":
        dependencies:
            babel-loader: "^10.1.1"
            "@babel/plugin-syntax-dynamic-import": "^7.8.3"

yarnPath: .yarn/releases/yarn-4.17.1.cjs

npmRegistryServer: "https://npm-registry.sipwise.com/"
